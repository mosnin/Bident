name: macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bident.app (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      # Signing and notarization run only when these repository secrets exist;
      # otherwise the app is ad-hoc signed (right-click → Open on first launch).
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package the app
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run desktop:dist -- --arm64
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run desktop:dist -- --arm64 -c.mac.identity=-
          fi

      - name: Smoke test the packaged app
        timeout-minutes: 5
        env:
          BIDENT_SMOKE_SCREENSHOT: ${{ runner.temp }}/bident-smoke.png
        run: release/mac-arm64/Bident.app/Contents/MacOS/Bident --smoke-test

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Bident-macOS-arm64
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: ${{ runner.temp }}/bident-smoke.png
          if-no-files-found: ignore
